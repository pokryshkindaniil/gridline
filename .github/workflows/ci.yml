name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gridline
          POSTGRES_PASSWORD: gridline
          POSTGRES_DB: gridline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridline" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gridline:gridline@localhost:5432/gridline
      TEST_DATABASE_URL: postgresql+psycopg://gridline:gridline@localhost:5432/gridline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/*/pyproject.toml
      - name: Install
        run: pip install -e packages/shared -e packages/calendar -e packages/sources -e "apps/api[dev]"
      - name: Lint (ruff)
        run: |
          ruff check apps/api
          ruff check packages --config apps/api/pyproject.toml
      - name: Create test database
        run: PGPASSWORD=gridline psql -h localhost -U gridline -d gridline -c "CREATE DATABASE gridline_test"
      - name: Validate Alembic migrations on a fresh Postgres
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check            # models and migrations must not drift
          alembic downgrade base   # every migration is reversible
          alembic upgrade head
      - name: Tests (pytest)
        working-directory: apps/api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images (no push, no deploy)
        run: |
          docker build -f apps/api/Dockerfile -t gridline-api:ci .
          docker build -f apps/web/Dockerfile -t gridline-web:ci apps/web
