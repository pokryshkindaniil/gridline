[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridline-sources"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gridline-shared", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5"]
license = { text = "AGPL-3.0-or-later" }

[tool.setuptools]
packages = [
  "gridline_sources",
  "gridline_sources.formula1",
  "gridline_sources.gt_world_challenge",
  "gridline_sources.fia_wec",
  "gridline_sources.imsa",
]

[tool.setuptools.package-data]
"*" = ["fixtures/*", "entry_fixtures/*", "fixtures_roster/*"]
