[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridline-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.2"]  # IANA db must not depend on the host OS (slim images lack legacy aliases)
license = { text = "AGPL-3.0-or-later" }

[tool.setuptools]
packages = ["gridline_shared"]
