# Full stack:  docker compose up --build
#   web        http://localhost:3000
#   api        http://localhost:8000   (docs: /docs)
#   scheduler  syncs every SYNC_INTERVAL_MINUTES (first run on start)
# Services talk to each other by service name (db, api) - never localhost.

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://gridline:${POSTGRES_PASSWORD:-gridline}@db:5432/gridline
  ENVIRONMENT: ${GRIDLINE_ENV:-development}
  # Address calendar apps / browsers use to reach the API (appears in webcal:// links)
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # Behind the web proxy / a reverse proxy the real client IP arrives in X-Forwarded-For
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridline}
      POSTGRES_DB: gridline
    ports:
      - "${GRIDLINE_DB_PORT:-5432}:5432"
    volumes:
      - gridline-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridline -d gridline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports:
      - "${GRIDLINE_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "python -m app.wait_for_db && exec gridline scheduler"]
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy   # api applies migrations before it reports healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "${GRIDLINE_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gridline-pgdata:
